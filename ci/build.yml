name: "📦 Build APK"

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Sobrescreve o versionName (ex.: 1.2.0). Vazio = usa o pubspec.yaml"
        required: false
        type: string

env:
  FLUTTER_CHANNEL: stable

jobs:
  apk:
    name: Compilar APK (release, por ABI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Aceitar licenças do Android SDK
        run: yes | sdkmanager --licenses || true

      - name: Cache dos núcleos libretro
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs
          key: libretro-cores-${{ runner.os }}-${{ hashFiles('tools/download_cores.sh') }}

      - name: Baixar núcleos libretro oficiais
        run: bash tools/download_cores.sh

      - name: flutter pub get
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes
        run: flutter test

      - name: Resolver versão do build
        id: ver
        run: |
          NAME=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          OVERRIDE="${{ inputs.version_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$OVERRIDE" ]; then
            NAME="$OVERRIDE"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Compilar APKs por ABI
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ github.run_number }}

      - name: Renomear artefatos
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            mv "$f" "peraatmuu-${{ steps.ver.outputs.name }}+${{ github.run_number }}-${f#app-}"
          done
          ls -la

      - name: Enviar artefatos baixáveis
        uses: actions/upload-artifact@v4
        with:
          name: peraatmuu-apk
          path: build/app/outputs/flutter-apk/peraatmuu-*.apk
          retention-days: 30

      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/peraatmuu-*.apk
          generate_release_notes: true
