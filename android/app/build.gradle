plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.peraatmuu.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.peraatmuu.app"
        // Libs nativas são extraídas da lib/ do APK para nativeLibraryDir
        // (necessário para carregar os núcleos libretro com dlopen por caminho absoluto).
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            // TODO: assine com uma chave própria antes de distribuir (docs/BUILD.md).
            // Por ora o APK de release é assinado com a chave de debug para facilitar testes.
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            // Mantém as .so extraíveis no dispositivo (extractNativeLibs=true).
            useLegacyPackaging = true
        }
    }
}

flutter {
    source = "../.."
}

dependencies {}
